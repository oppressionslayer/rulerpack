[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rulerpack"
version = "0.2.0"
description = "Lars Rocha's XOR rulers: pack a prime and its index into one integer and recover both with mod and XOR."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Lars Rocha"}]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest"]
fast = ["gmpy2"]

[project.scripts]
rulerpack = "rulerpack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
